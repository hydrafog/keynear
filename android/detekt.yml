config:
  validation: true
  warningsAsErrors: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - "Composable"
  PackageNaming:
    active: true

complexity:
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 25
    allowedFunctionsPerClass: 55
    allowedFunctionsPerInterface: 30
    allowedFunctionsPerObject: 25
    ignorePrivate: true
  LargeClass:
    active: false
  LongParameterList:
    active: true
    allowedFunctionParameters: 4
    allowedConstructorParameters: 4
    ignoreAnnotated:
      - "Composable"
  LongMethod:
    active: true
    allowedLines: 50
    ignoreAnnotated:
      - "Composable"
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 10
  ComplexCondition:
    active: false
  NestedBlockDepth:
    active: true
    allowedDepth: 3

style:
  MagicNumber:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ReturnCount:
    active: true
    max: 10
  MaxLineLength:
    active: true
    maxLineLength: 140
  ThrowsCount:
    active: true
    max: 4
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - value: "NOCOMMIT"
        reason: "Remove temporary debug markers before commit."
      - value: "STOPSHIP"
        reason: "Resolve shipping blockers before merge."

exceptions:
  TooGenericExceptionCaught:
    active: false

coroutines:
  active: true

