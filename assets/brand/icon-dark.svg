<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Keynear (Calm Monochromatic Slate)">
  <title>Keynear</title>
  <defs>
    <linearGradient id="knd-bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#13223D"/>
      <stop offset="100%" stop-color="#0A1324"/>
    </linearGradient>
    <linearGradient id="knd-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A74B8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1A3260" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="knd-bot-pillar" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#102C6E"/>
      <stop offset="100%" stop-color="#1E4DB8"/>
    </linearGradient>
    <linearGradient id="knd-top-wing" x1="0.15" y1="0.85" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#1948AD"/>
      <stop offset="100%" stop-color="#4C8DFF"/>
    </linearGradient>
    <linearGradient id="knd-front-ribbon" x1="0.15" y1="0.08" x2="0.88" y2="0.92">
      <stop offset="0%" stop-color="#8EC0FF"/>
      <stop offset="50%" stop-color="#458DFF"/>
      <stop offset="100%" stop-color="#1B64E8"/>
    </linearGradient>
    <linearGradient id="knd-w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78B0FF"/>
      <stop offset="100%" stop-color="#3578F0"/>
    </linearGradient>
    <linearGradient id="knd-w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C84E0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#2452B0" stop-opacity="0.40"/>
    </linearGradient>
    <filter id="knd-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
        values="0 0 0 0 0.01  0 0 0 0 0.02  0 0 0 0 0.07  0 0 0 0.45 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="knd-fold" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="-2" dy="6" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
        values="0 0 0 0 0.01  0 0 0 0 0.02  0 0 0 0 0.07  0 0 0 0.58 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#knd-bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="url(#knd-rim)" stroke-width="3"/>
  <g filter="url(#knd-ambient)">
    <path d="M 336 202 A 72 72 0 0 1 336 310" fill="none" stroke="url(#knd-w1)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 376 172 A 112 112 0 0 1 376 340" fill="none" stroke="url(#knd-w2)" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g filter="url(#knd-ambient)">
    <rect x="128" y="232" width="64" height="168" rx="32" fill="url(#knd-bot-pillar)"/>
    <path d="M 174 264 L 322 136" fill="none" stroke="url(#knd-top-wing)" stroke-width="64" stroke-linecap="round"/>
    <g filter="url(#knd-fold)">
      <path d="M 160 144 L 160 248 Q 160 270 178 284 L 322 374" fill="none" stroke="url(#knd-front-ribbon)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

