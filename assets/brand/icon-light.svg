<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Keynear (Porcelain Studio &amp; Cobalt)">
  <title>Keynear</title>
  <defs>
    <linearGradient id="knl-bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#E1EBF8"/>
    </linearGradient>
    <linearGradient id="knl-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C5D6EE" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="knl-bot-pillar" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#002C8F"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
    <linearGradient id="knl-top-wing" x1="0.15" y1="0.85" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#1458DC"/>
      <stop offset="100%" stop-color="#5E9EFF"/>
    </linearGradient>
    <linearGradient id="knl-front-ribbon" x1="0.15" y1="0.08" x2="0.88" y2="0.92">
      <stop offset="0%" stop-color="#68ADFF"/>
      <stop offset="48%" stop-color="#1E74F6"/>
      <stop offset="100%" stop-color="#004CED"/>
    </linearGradient>
    <linearGradient id="knl-w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5296F7"/>
      <stop offset="100%" stop-color="#1A66E8"/>
    </linearGradient>
    <linearGradient id="knl-w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AB6F9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5A92EE" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="knl-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
        values="0 0 0 0 0.02  0 0 0 0 0.08  0 0 0 0 0.24  0 0 0 0.16 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="knl-fold" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="-2" dy="6" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
        values="0 0 0 0 0.02  0 0 0 0 0.08  0 0 0 0 0.24  0 0 0 0.28 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#knl-bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="url(#knl-rim)" stroke-width="3"/>
  <g filter="url(#knl-ambient)">
    <path d="M 336 202 A 72 72 0 0 1 336 310" fill="none" stroke="url(#knl-w1)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 376 172 A 112 112 0 0 1 376 340" fill="none" stroke="url(#knl-w2)" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g filter="url(#knl-ambient)">
    <rect x="128" y="232" width="64" height="168" rx="32" fill="url(#knl-bot-pillar)"/>
    <path d="M 174 264 L 322 136" fill="none" stroke="url(#knl-top-wing)" stroke-width="64" stroke-linecap="round"/>
    <g filter="url(#knl-fold)">
      <path d="M 160 144 L 160 248 Q 160 270 178 284 L 322 374" fill="none" stroke="url(#knl-front-ribbon)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

