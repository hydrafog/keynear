[workspace]
resolver = "2"
members = [
    "crates/keynear-protocol",
    "crates/keynear-core",
    "crates/keynear-ffi",
    "crates/keynear-ipc",
    "crates/keynear",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/hydrafog/keynear"

[workspace.dependencies]
aes-gcm = "0.11"
ashpd = { version = "0.14.0", default-features = false, features = ["file_chooser", "tokio"] }
bluer = { version = "0.17", features = ["bluetoothd"] }
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
iroh = { version = "1.4.1", default-features = false, features = ["tls-aws-lc-rs"] }
ksni = "0.3.7"
mdns-sd = "0.22.0"
oo7 = "0.7"
prost = "0.14"
prost-build = "0.14"
rand = "0.10"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
snow = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.32"
uuid = { version = "1.29", features = ["v4"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", default-features = false, features = ["xfixes"] }
x25519-dalek = { version = "3.0", features = ["static_secrets", "getrandom"] }
zbus = { version = "6.3.0", features = ["tokio"] }
zeroize = { version = "1.9", features = ["derive"] }
zip = { version = "9.4.1", default-features = false }
