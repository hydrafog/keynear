[workspace]
resolver = "2"
members = [
    "crates/keynear-core",
    "crates/keynear-linux",
    "crates/keynear-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/hydrafog/keynear"

[workspace.dependencies]
gtk4 = "0.11"
prost = "0.14"
prost-build = "0.14"
relm4 = "0.11"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.32"
