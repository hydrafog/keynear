<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Keynear symbolic mark" class="kn-symbolic">
  <title>Keynear</title>
  <style>
    /* Matches Keynear's --kn-brand-ink token when viewed standalone; inherits currentColor when inlined */
    .kn-symbolic { color: #0E748A; }
    @media (prefers-color-scheme: dark) {
      .kn-symbolic { color: #4ABBD5; }
    }
  </style>

  <!-- Soft beacon aura behind the key bow (echoing the Receive radar glow) -->
  <circle cx="232" cy="290" r="88" fill="currentColor" fill-opacity="0.08"/>

  <!-- Concentric orbital radar tracks cleanly parted around the key shaft, waves, and peer halo -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- Outer radar contour arcs (r = 224) -->
    <path d="M 60.4 146.0 A 224 224 0 0 1 330.2 88.7" stroke-width="5" stroke-opacity="0.18"/>
    <path d="M 452.6 251.1 A 224 224 0 0 1 393.1 445.6" stroke-width="5" stroke-opacity="0.18"/>

    <!-- Middle orbital ring connecting outer wave and orbiting peer (r = 166) -->
    <path d="M 389.9 238.7 A 166 166 0 0 1 398.0 287.1" stroke-width="6" stroke-opacity="0.24"/>
    <path d="M 371.2 380.4 A 166 166 0 0 1 86.8 209.5" stroke-width="6" stroke-opacity="0.24"/>

    <!-- Inner orbital ring connecting back into the inner wave (r = 116) -->
    <path d="M 339.6 246.5 A 116 116 0 1 1 118.5 265.9" stroke-width="6" stroke-opacity="0.30"/>
  </g>

  <!-- Active proximity wave arcs riding on the inner and middle orbits -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M 101.2 187.8 A 166 166 0 0 1 272.2 128.9" stroke-width="18" stroke-opacity="0.68"/>
    <path d="M 127.7 239.1 A 116 116 0 0 1 267.8 179.7" stroke-width="22" stroke-opacity="0.88"/>
  </g>

  <!-- Orbiting peer beacon with translucent halo sitting directly on the r = 166 orbit -->
  <circle cx="391.6" cy="335.8" r="34" fill="currentColor" fill-opacity="0.22"/>
  <circle cx="391.6" cy="335.8" r="18" fill="currentColor" fill-opacity="0.96"/>

  <!-- Foreground cryptographic key with exact brand proportions -->
  <g fill="none" stroke="currentColor" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="232" cy="290" r="54"/>
    <path d="M 270.2 251.8 L 387.6 134.4 L 424.3 171.2"/>
    <path d="M 339.5 182.5 L 364.9 208.0"/>
  </g>
</svg>
