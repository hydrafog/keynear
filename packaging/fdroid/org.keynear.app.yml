AuthorName: Hydrafog
WebSite: https://github.com/hydrafog/keynear
SourceCode: https://github.com/hydrafog/keynear
IssueTracker: https://github.com/hydrafog/keynear/issues
AutoName: Keynear
Summary: Direct, private continuity between Linux and Android
Description: |
  Keynear pairs a Linux desktop with an Android phone over authenticated,
  relay-free QUIC. It streams files with resumable 60 KiB checkpoints, syncs
  clipboard and one-time codes, hands off Bluetooth audio, and exposes paired
  shared directories through a native document provider.

  The F-Droid release builds the foss flavor with zero Google Play Services
  dependencies.
RepoType: git
Repo: https://github.com/hydrafog/keynear
Builds:
  - versionName: 1.3.0
    versionCode: 9
    commit: v1.3.0
    subdir: android
    ndk: 30.0.16248370
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends protobuf-compiler cmake
    init:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install --locked cargo-ndk
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_NDK_HOME="$$NDK$$"
      - cargo ndk -t arm64-v8a -t x86_64 -o core-ffi/src/main/jniLibs build --release --manifest-path ../Cargo.toml -p keynear-ffi
    gradle:
      - foss
AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.3.0
CurrentVersionCode: 9
