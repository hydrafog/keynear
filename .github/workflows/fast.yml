name: Fast Feedback

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/artifacts/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/artifacts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config
      - name: Shell syntax & repo check
        run: |
          bash -n scripts/*/*.sh
          bash scripts/validation/repo-check.sh
          bash scripts/validation/size-check.sh
      - name: Design token guard
        run: python3 scripts/validation/token-check.py
      - name: Cargo check
        run: cargo check --locked --workspace --all-features
      - name: Nix flake check (when available)
        run: |
          if command -v nix >/dev/null 2>&1; then
            nix flake check --no-build
          else
            echo "nix unavailable; skipping flake check"
          fi
