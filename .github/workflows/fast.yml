name: Fast Feedback

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config
      - name: Shell syntax & repo check
        run: |
          bash -n scripts/*/*.sh
          bash scripts/validation/repo-check.sh
          bash scripts/validation/size-check.sh
      - name: Design token guard
        run: python3 scripts/validation/token-check.py
      - name: Cargo check
        run: cargo check --workspace --all-features
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Native Android libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a -t x86_64 -o android/core-ffi/src/main/jniLibs build --release -p keynear-ffi
      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Nix flake check (when available)
        run: |
          if command -v nix >/dev/null 2>&1; then
            nix flake check --no-build
          else
            echo "nix unavailable; skipping flake check"
          fi
