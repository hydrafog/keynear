name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config
      - name: Build Linux release binary
        run: cargo build --release --locked -p keynear
      - name: Package Linux release archive
        run: |
          mkdir -p dist
          cp target/release/keynear dist/keynear
          tar -C dist -czf dist/keynear-linux-x86_64.tar.gz keynear
          (cd dist && sha256sum keynear-linux-x86_64.tar.gz > keynear-linux-x86_64.tar.gz.sha256)
      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: keynear-linux-x86_64
          path: |
            dist/keynear-linux-x86_64.tar.gz
            dist/keynear-linux-x86_64.tar.gz.sha256
      - name: Attach Linux binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keynear-linux-x86_64.tar.gz
            dist/keynear-linux-x86_64.tar.gz.sha256

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required repository secret: $var" >&2
              exit 1
            fi
          done
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYNEAR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build Android native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a -t x86_64 -o android/core-ffi/src/main/jniLibs build --release -p keynear-ffi
      - name: Assemble signed release APKs
        working-directory: android
        env:
          KEYNEAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYNEAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYNEAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleGmsRelease assembleFossRelease
      - name: Verify APK signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for flavor in gms foss; do
            apk="android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            test -f "$apk" || { echo "Missing signed APK: $apk" >&2; exit 1; }
            "$apksigner" verify --verbose "$apk"
          done
      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keynear-signed-apks
          path: |
            android/app/build/outputs/apk/gms/release/app-gms-release.apk
            android/app/build/outputs/apk/foss/release/app-foss-release.apk
      - name: Attach signed APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/gms/release/app-gms-release.apk
            android/app/build/outputs/apk/foss/release/app-foss-release.apk

