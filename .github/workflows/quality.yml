name: Quality Gate

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/artifacts/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/artifacts/**"
  merge_group:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit message check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            author_email="$(git log -n 1 --format=%ae "$sha")"
            if [ "$author_email" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              continue
            fi
            tmp="$(mktemp)"
            git log -n 1 --format=%B "$sha" > "$tmp"
            bash scripts/validation/commit-msg.sh "$tmp"
            rm -f "$tmp"
          done < <(git rev-list --no-merges "$range")
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config
      - name: Repository hygiene check
        run: bash scripts/validation/repo-check.sh
      - name: Size cap check
        run: bash scripts/validation/size-check.sh
      - name: Design token guard
        run: python3 scripts/validation/token-check.py
      - name: Design drift lint
        run: bash scripts/validation/design-lint.sh
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace --all-features
      - name: Dependency audit and license policy
        run: |
          cargo deny check
          cargo audit
      - name: Coverage gate
        run: cargo llvm-cov --locked -p keynear-protocol -p keynear-core -p keynear-ffi -p keynear-ipc --all-features --fail-under-lines 87 --fail-under-functions 80 --fail-under-regions 80 --summary-only

  fuzz:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-fuzz'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config g++
      - name: Fuzz IPC codec
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ipc_codec -- -max_total_time=30 -rss_limit_mb=2048
      - name: Fuzz proto decode
        run: cargo fuzz run --target x86_64-unknown-linux-gnu proto_decode -- -max_total_time=30 -rss_limit_mb=2048

  nix:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-nix'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v16
        with:
          name: hydrafog
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Nix flake check and package builds
        run: |
          nix flake check --no-build
          nix build --no-link .#keynear .#keynear-fuse .#keynear-gnome-extension

  android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-android'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake
      - name: Build Android native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a -t x86_64 -o android/core-ffi/src/main/jniLibs build --locked --release -p keynear-ffi
      - name: Expose NDK LLVM tools
        run: echo "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Verify 16 KB ELF page alignment
        run: |
          for abi in arm64-v8a x86_64; do
            so="android/core-ffi/src/main/jniLibs/$abi/libkeynear_core.so"
            test -f "$so" || { echo "missing $so" >&2; exit 1; }
            aligns="$(llvm-readelf -l "$so" | awk '$1 == "LOAD" { print $NF }')"
            test -n "$aligns" || { echo "no LOAD headers in $so" >&2; exit 1; }
            for align in $aligns; do
              case "$align" in
                0x*|[0-9]*) ;;
                *) echo "$so has unreadable LOAD alignment $align" >&2; exit 1 ;;
              esac
              decimal=$((align))
              if [ "$decimal" -lt 16384 ]; then
                echo "$so LOAD alignment $align is below 16 KB" >&2
                exit 1
              fi
            done
          done
      - name: Native library load smoke
        run: |
          for abi in arm64-v8a x86_64; do
            so="android/core-ffi/src/main/jniLibs/$abi/libkeynear_core.so"
            llvm-readelf -h "$so" | grep -q 'Shared object file' || { echo "$so is not a shared object" >&2; exit 1; }
            llvm-nm -D "$so" | grep -q 'uniffi_' || { echo "$so exports no UniFFI bridge symbols" >&2; exit 1; }
          done
      - name: Android unit tests, lint, detekt, and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug detekt assembleDebug
