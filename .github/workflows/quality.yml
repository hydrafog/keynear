name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config
      - name: Repository hygiene check
        run: bash scripts/validation/repo-check.sh
      - name: Size cap check
        run: bash scripts/validation/size-check.sh
      - name: Design token guard
        run: python3 scripts/validation/token-check.py
      - name: Design drift lint
        run: bash scripts/validation/design-lint.sh
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-features
      - name: Dependency audit and license policy
        run: |
          cargo deny check
          cargo audit
      - name: Coverage gate
        run: cargo llvm-cov -p keynear-protocol -p keynear-core -p keynear-ffi -p keynear-ipc --all-features --fail-under-lines 75 --summary-only

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config g++
      - name: Fuzz IPC codec
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ipc_codec -- -max_total_time=30 -rss_limit_mb=2048
      - name: Fuzz proto decode
        run: cargo fuzz run --target x86_64-unknown-linux-gnu proto_decode -- -max_total_time=30 -rss_limit_mb=2048

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v16
        with:
          name: hydrafog
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Nix flake check and package builds
        run: |
          nix flake check --no-build
          nix build --no-link .#keynear .#keynear-fuse .#keynear-gnome-extension

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake
      - name: Build Android native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a -t x86_64 -o android/core-ffi/src/main/jniLibs build --release -p keynear-ffi
      - name: Expose NDK LLVM tools
        run: echo "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Verify 16 KB ELF page alignment
        run: |
          for abi in arm64-v8a x86_64; do
            so="android/core-ffi/src/main/jniLibs/$abi/libkeynear_core.so"
            test -f "$so" || { echo "missing $so" >&2; exit 1; }
            aligns="$(llvm-readelf -l "$so" | awk '$1 == "LOAD" { print $NF }')"
            test -n "$aligns" || { echo "no LOAD headers in $so" >&2; exit 1; }
            for align in $aligns; do
              case "$align" in
                0x*|[0-9]*) ;;
                *) echo "$so has unreadable LOAD alignment $align" >&2; exit 1 ;;
              esac
              decimal=$((align))
              if [ "$decimal" -lt 16384 ]; then
                echo "$so LOAD alignment $align is below 16 KB" >&2
                exit 1
              fi
            done
          done
      - name: Native library load smoke
        run: |
          for abi in arm64-v8a x86_64; do
            so="android/core-ffi/src/main/jniLibs/$abi/libkeynear_core.so"
            llvm-readelf -h "$so" | grep -q 'Shared object file' || { echo "$so is not a shared object" >&2; exit 1; }
            llvm-nm -D "$so" | grep -q 'uniffi_' || { echo "$so exports no UniFFI bridge symbols" >&2; exit 1; }
          done
      - name: Android unit tests, lint, detekt, and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug detekt assembleDebug
