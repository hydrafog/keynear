<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Keynear">
  <title>Keynear</title>
  <defs>
    <linearGradient id="kn-bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#1E7CFA"/>
      <stop offset="52%" stop-color="#0656E8"/>
      <stop offset="100%" stop-color="#0038B8"/>
    </linearGradient>
    <linearGradient id="kn-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80BAFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#002B8F" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="kn-bot-pillar" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3E82F7"/>
      <stop offset="100%" stop-color="#7EB2FF"/>
    </linearGradient>
    <linearGradient id="kn-top-wing" x1="0.15" y1="0.85" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#6CA6FF"/>
      <stop offset="100%" stop-color="#C8E2FF"/>
    </linearGradient>
    <linearGradient id="kn-front-ribbon" x1="0.15" y1="0.08" x2="0.88" y2="0.92">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#EEF5FF"/>
      <stop offset="100%" stop-color="#C8E0FF"/>
    </linearGradient>
    <linearGradient id="kn-w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F7FF"/>
      <stop offset="100%" stop-color="#B8D8FF"/>
    </linearGradient>
    <linearGradient id="kn-w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4D4FF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#7EB0FF" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="kn-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
