<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Keynear">
  <title>Keynear</title>
  <defs>
    <!-- Squircle clip for subtle atmospheric radar rings -->
    <clipPath id="kn-clip">
      <rect x="24" y="24" width="464" height="464" rx="112"/>
    </clipPath>

    <!-- Brand squircle lighting matching Keynear's luminous cyan-azure tokens -->
    <radialGradient id="kn-sheen" cx="0.18" cy="0.08" r="0.78">
      <stop offset="0%" stop-color="#96F0FA" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#8AE8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kn-shift" cx="0.92" cy="0.96" r="0.78">
      <stop offset="0%" stop-color="#2F8ED0" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#4BA6DF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kn-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2F8FD" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0A6A7E" stop-opacity="0.32"/>
    </linearGradient>

    <!-- Ambient beacon aura behind the key bow (echoing Receive radar glow) -->
    <radialGradient id="kn-aura" cx="198" cy="314" r="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8FAFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#8AE8F5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8AE8F5" stop-opacity="0"/>
    </radialGradient>

    <!-- Proximity wave arcs & orbiting peer gradients -->
    <linearGradient id="kn-wave-1" x1="94" y1="263" x2="234" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C6EEF8" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#F7FEFF" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="kn-wave-2" x1="67" y1="212" x2="238" y2="153" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9DDEF0" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#E2F8FD" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="kn-peer" x1="340" y1="342" x2="376" y2="378" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8EFF8"/>
    </linearGradient>

    <!-- Unified userSpaceOnUse gradient so bow, shaft, and teeth fuse seamlessly -->
    <linearGradient id="kn-key" x1="144" y1="148" x2="396" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4F9FD"/>
    </linearGradient>

    <!-- Soft cyan-slate elevation shadows matching Keynear's tactile depth -->
    <filter id="kn-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
        values="0 0 0 0 0.00  0 0 0 0 0.16  0 0 0 0 0.24  0 0 0 0.20 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="kn-key-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
        values="0 0 0 0 0.00  0 0 0 0 0.17  0 0 0 0 0.24  0 0 0 0.26 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base squircle container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#4ABBD5"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#kn-sheen)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#kn-shift)"/>

  <!-- Background concentric proximity radar field (echoing WaveMapCanvas) -->
  <g clip-path="url(#kn-clip)">
    <circle cx="198" cy="314" r="156" fill="url(#kn-aura)"/>
    <circle cx="198" cy="314" r="116" fill="none" stroke="#E8FCFF" stroke-opacity="0.22" stroke-width="2.5"/>
    <circle cx="198" cy="314" r="166" fill="none" stroke="#E8FCFF" stroke-opacity="0.17" stroke-width="2.5"/>
    <circle cx="198" cy="314" r="224" fill="none" stroke="#E8FCFF" stroke-opacity="0.11" stroke-width="2"/>
  </g>

  <!-- Glass rim highlight -->
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="url(#kn-rim)" stroke-width="3"/>

  <!-- Proximity wave arcs & orbiting nearby peer beacon (concentric to the key bow) -->
  <g filter="url(#kn-ambient)">
    <path d="M 93.7 263.1 A 116 116 0 0 1 233.8 203.7" fill="none" stroke="url(#kn-wave-1)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 67.2 211.8 A 166 166 0 0 1 238.2 152.9" fill="none" stroke="url(#kn-wave-2)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="357.6" cy="359.8" r="34" fill="#DDF8FD" fill-opacity="0.24"/>
    <circle cx="357.6" cy="359.8" r="18" fill="url(#kn-peer)"/>
  </g>

  <!-- Sculpted foreground key (cryptographic pairing & Android Keystore trust) -->
  <g filter="url(#kn-key-shadow)">
    <circle cx="198" cy="314" r="54" fill="none" stroke="url(#kn-key)" stroke-width="42"/>
    <path d="M 236.2 275.8 L 353.6 158.4 L 390.3 195.2" fill="none" stroke="url(#kn-key)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 305.5 206.5 L 330.9 232.0" fill="none" stroke="url(#kn-key)" stroke-width="42" stroke-linecap="round"/>
  </g>
</svg>
