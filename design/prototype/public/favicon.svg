    <g filter="url(#kn-fold)">
      <path d="M 160 144 L 160 248 Q 160 270 178 284 L 322 374" fill="none" stroke="url(#kn-front-ribbon)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
