syntax = "proto3";

package keynear.v1;

message Envelope {
  uint32 version = 1;
  uint64 sequence = 2;
  int64 timestamp_ms = 3;

  oneof payload {
    HandshakePayload handshake = 10;
    TransferOffer transfer_offer = 11;
    ClipboardPayload clipboard = 12;
    AudioStatePayload audio_state = 13;
    ControlAck control_ack = 14;
    LanEndpoint lan_endpoint = 15;
    TransferConsent transfer_consent = 16;
    TransferCancel transfer_cancel = 17;
    TransferComplete transfer_complete = 18;
    ClipboardOffer clipboard_offer = 19;
    ClipboardFetch clipboard_fetch = 20;
    AudioHandoff audio_handoff = 21;
    CapabilityNegotiation capability_negotiation = 22;
    FallbackProbe fallback_probe = 23;
  }
}

message HandshakePayload {
  string device_id = 1;
  string display_name = 2;
  bytes ephemeral_pubkey = 3;
  uint32 capability_flags = 4;
  bytes auth_proof = 5;
}

message TransferOffer {
  string transfer_id = 1;
  repeated TransferItemMeta items = 2;
  uint64 total_bytes = 3;
}

message TransferItemMeta {
  string name = 1;
  string mime_type = 2;
  uint64 size_bytes = 3;
  bool is_directory = 4;
}

message ClipboardPayload {
  string mime_type = 1;
  bytes data = 2;
  bool is_otp = 3;
}

message AudioStatePayload {
  string peripheral_id = 1;
  bool active_call = 2;
  bool sink_claimed = 3;
}

message ControlAck {
  uint64 acked_sequence = 1;
  bool accepted = 2;
  string reason = 3;
}

message LanEndpoint {
  string device_id = 1;
  bytes endpoint_id = 2;
  repeated string socket_addrs = 3;
  uint32 capability_flags = 4;
  int64 issued_at_ms = 5;
}

message TransferConsent {
  string transfer_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message TransferCancel {
  string transfer_id = 1;
  string reason = 2;
}

message TransferComplete {
  string transfer_id = 1;
  uint64 bytes_transferred = 2;
  bytes sha256_digest = 3;
}

message ClipboardOffer {
  string offer_id = 1;
  repeated string mime_types = 2;
  bool is_image = 3;
  bool is_otp = 4;
  uint64 byte_size = 5;
}

message ClipboardFetch {
  string offer_id = 1;
  string mime_type = 2;
}

enum HandoffPhase {
  HANDOFF_UNSPECIFIED = 0;
  HANDOFF_PREPARE = 1;
  HANDOFF_RELEASED = 2;
  HANDOFF_CLAIMED = 3;
  HANDOFF_RESUMED = 4;
  HANDOFF_ABORTED = 5;
}

enum SinkProfile {
  SINK_UNSPECIFIED = 0;
  SINK_BAP = 1;
  SINK_A2DP = 2;
  SINK_HFP_HF = 3;
}

message AudioHandoff {
  string peripheral_id = 1;
  uint64 sequence = 2;
  HandoffPhase phase = 3;
  SinkProfile sink_profile = 4;
  bool playback_paused = 5;
  string reason = 6;
}

enum RangingMethod {
  RANGING_NONE = 0;
  RANGING_BLE_CS = 1;
  RANGING_UWB = 2;
}

message CapabilityNegotiation {
  uint32 local_flags = 1;
  uint32 peer_flags = 2;
  uint32 negotiated_flags = 3;
  RangingMethod preferred_ranging = 4;
}

enum FallbackMedia {
  MEDIA_NONE = 0;
  MEDIA_WIFI_AWARE_NAN = 1;
  MEDIA_WIFI_DIRECT_R2 = 2;
}

enum FallbackStatus {
  STATUS_UNAVAILABLE = 0;
  STATUS_AVAILABLE = 1;
  STATUS_DISALLOWED = 2;
}

message FallbackProbe {
  FallbackMedia media = 1;
  FallbackStatus status = 2;
  string detail = 3;
}

